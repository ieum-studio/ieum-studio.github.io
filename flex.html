<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소비 습관 판독기</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --flex: #fdcb6e;
            --beggar: #a29bfe;
        }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: #f7f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #2d3436;
        }
        #container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        .hidden { display: none; }
        .char-img { font-size: 100px; margin-bottom: 20px; }
        h1 { font-size: 26px; margin-bottom: 10px; color: var(--primary); }
        .sub-text { font-size: 16px; color: #636e72; margin-bottom: 30px; line-height: 1.5; }
        
        /* 버튼 스타일 */
        button {
            width: 100%;
            padding: 18px;
            margin: 8px 0;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        button:active { transform: scale(0.98); }
        
        .btn-start { background: var(--primary); color: white; }
        .btn-yes { background: #ff7675; color: white; }
        .btn-no { background: #55efc4; color: #2d3436; }
        .btn-retry { background: #dfe6e9; color: #636e72; margin-top: 20px; }

        /* 진행바 */
        .progress-container {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        #progress-bar {
            width: 12.5%;
            height: 100%;
            background: var(--primary);
            border-radius: 10px;
            transition: 0.3s;
        }

        /* 결과창 */
        .result-box {
            background: #f1f2f6;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            margin: 20px 0;
            line-height: 1.8;
        }
        .flex-title { color: #e17055; font-weight: bold; }
        .beggar-title { color: #0984e3; font-weight: bold; }
    </style>
</head>
<body>

<div id="container">
    <!-- 1. 첫 화면 -->
    <div id="start-screen">
        <div class="char-img">💸</div>
        <h1>내 소비 습관 판독기</h1>
        <p class="sub-text">8개의 질문으로 알아보는<br>나는 <b>거지형</b>인가, <b>FLEX형</b>인가?</p>
        <button class="btn-start" onclick="startQuiz()">테스트 시작하기</button>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="question-screen" class="hidden">
        <div class="progress-container"><div id="progress-bar"></div></div>
        <p id="q-num" style="color:var(--primary); font-weight:bold;">Q1</p>
        <h2 id="question-text" style="height: 80px; display: flex; align-items: center; justify-content: center;">질문 내용</h2>
        <button class="btn-yes" onclick="next(true)">그렇다 (YES)</button>
        <button class="btn-no" onclick="next(false)">아니다 (NO)</button>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="hidden">
        <div id="res-char" class="char-img"></div>
        <h1 id="res-title">결과</h1>
        <div class="result-box" id="res-desc"></div>
        <button class="btn-retry" onclick="location.reload()">다시 테스트하기</button>
    </div>
</div>

<script>
    const questions = [
        "사고 싶은 물건이 생기면 일단 결제부터 한다.",
        "한 달에 배달 음식 비용이 20만 원 이상이다.",
        "스트레스를 받으면 '시발비용'을 쓰는 편이다.",
        "한정판이나 '오늘만 특가'는 참을 수 없다.",
        "통장 잔고를 확인하는 게 가끔 두렵다.",
        "편의점 2+1 행사보다 그냥 내가 먹고 싶은 걸 산다.",
        "친구들에게 밥이나 술을 사는 것이 아깝지 않다.",
        "미래의 나보다 현재의 즐거움이 더 중요하다."
    ];

    let current = 0;
    let flexScore = 0;

    function startQuiz() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('question-screen').classList.remove('hidden');
        updateQuestion();
    }

    function updateQuestion() {
        document.getElementById('q-num').innerText = `Q${current + 1}`;
        document.getElementById('question-text').innerText = questions[current];
        document.getElementById('progress-bar').style.width = ((current + 1) / 8 * 100) + "%";
    }

    function next(isFlex) {
        if (isFlex) flexScore++;
        current++;

        if (current < questions.length) {
            updateQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('question-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        const resChar = document.getElementById('res-char');
        const resTitle = document.getElementById('res-title');
        const resDesc = document.getElementById('res-desc');

        if (flexScore >= 5) {
            resChar.innerText = "💎";
            resTitle.innerHTML = "당신은 <span class='flex-title'>'인생은 한 번뿐 FLEX형'</span>";
            resDesc.innerHTML = `
                • 현재의 행복을 위해 지갑을 여는 것에 망설임이 없으시군요!<br>
                • '나를 위한 선물'이라는 명목하에 매달 카드값과 전쟁 중입니다.<br>
                • 화끈한 소비만큼 화끈한 에너지를 가졌지만 저축도 조금은 필요해요.
            `;
        } else {
            resChar.innerText = "📦";
            resTitle.innerHTML = "당신은 <span class='beggar-title'>'알뜰살뜰 갓생 거지형'</span>";
            resDesc.innerHTML = `
                • 100원 단위 최저가 비교에 희열을 느끼는 짠테크 고수입니다!<br>
                • 감정적인 소비보다는 계획적이고 이성적인 소비를 지향하시네요.<br>
                • 너무 아끼기만 하면 삶이 팍팍할 수 있으니 가끔은 FLEX 해보세요.
            `;
        }
    }
</script>

</body>
</html>
