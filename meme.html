<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>밈 감성 한 줄 생성기 ⚡</title>
    <style>
        :root {
            --primary: #ff3e60;
            --bg: #0f172a;
            --card: #1e293b;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #app {
            width: 90%;
            max-width: 420px;
            text-align: center;
        }
        .hidden { display: none; }
        
        /* 카드 디자인 */
        .glass-card {
            background: var(--card);
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        /* 버튼 스타일 */
        .btn {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-topic { background: #334155; color: white; text-align: left; padding-left: 25px; }
        .btn-topic:hover { background: #475569; }
        .btn-yes { background: var(--primary); color: white; }
        .btn-no { background: #94a3b8; color: #0f172a; }
        .btn-main { background: #f8fafc; color: #0f172a; margin-top: 20px; }

        /* 결과 화면 (캡쳐용) */
        #result-screen.active {
            background: white;
            color: black;
            padding: 60px 20px;
        }
        .result-text {
            font-size: 24px;
            font-weight: 900;
            line-height: 1.5;
            word-break: keep-all;
            margin: 30px 0;
        }
        .progress { font-size: 14px; color: #64748b; margin-bottom: 20px; }
    </style>
</head>
<body>

<div id="app">
    <!-- 1. 메인 화면 -->
    <div id="start-screen" class="glass-card">
        <div style="font-size: 50px; margin-bottom: 10px;">⚡</div>
        <h1>한 줄 생성기</h1>
        <p style="color: #94a3b8; margin-bottom: 30px;">원하는 주제를 선택해 주세요</p>
        <button class="btn btn-topic" onclick="selectTopic('life')">1. 내 인생 요약 한 줄</button>
        <button class="btn btn-topic" onclick="selectTopic('fortune')">2. 올해 운세 한 줄</button>
        <button class="btn btn-topic" onclick="selectTopic('nickname')">3. 나의 밈 닉네임</button>
        <button class="btn btn-topic" onclick="selectTopic('spend')">4. 나의 소비습관 한 줄</button>
        <button class="btn btn-topic" onclick="selectTopic('work')">5. 직장생활 한 줄</button>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="quiz-screen" class="glass-card hidden">
        <div class="progress" id="progress">1 / 5</div>
        <h2 id="question-text" style="min-height: 80px; display: flex; align-items: center; justify-content: center;">질문</h2>
        <button class="btn btn-yes" onclick="handleAnswer(true)">그렇다</button>
        <button class="btn btn-no" onclick="handleAnswer(false)">아니다</button>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="glass-card hidden">
        <p id="result-topic-name" style="font-size: 14px; color: #64748b;">결과</p>
        <div class="result-text" id="result-output">문장 생성 중...</div>
        <button class="btn btn-main" onclick="location.reload()">다시 만들기</button>
    </div>
</div>

<script>
    const quizData = {
        life: {
            title: "내 인생 요약",
            questions: [
                "침대에 누워있을 때 가장 행복하다",
                "가끔 내가 천재가 아닐까 생각한다",
                "약속이 취소되면 은근히 기쁘다",
                "갓생을 살고 싶지만 몸이 안 따라준다",
                "인생은 원래 혼자라고 생각한다"
            ],
            results: (yes) => [
                "태어난 김에 사는데 은근히 열심히 삼",
                "겉은 멀쩡한데 속은 다 녹은 소프트콘",
                "침대와 물아일체 된 누워있기 전문가",
                "천재성보단 광기가 조금 더 앞서는 편",
                "이 구역의 조용한 관종이자 유리멘탈"
            ]
        },
        fortune: {
            title: "올해 운세",
            questions: [
                "최근 길에서 돈을 주운 적이 있다",
                "올해는 유독 잠이 많아진 것 같다",
                "로또 1등 되면 뭐할지 다 정해놨다",
                "좋은 일이 생길 것 같은 예감이 든다",
                "주변에 나를 돕는 사람이 많다"
            ],
            results: (yes) => [
                "돈 빼고 다 들어오는 아주 알찬 운세",
                "숨만 쉬어도 귀인이 찾아올 대운의 해",
                "횡재수는 없으나 먹을 복은 터질 예정",
                "로또보다 당첨되기 힘든 갓생 살 운명",
                "조상님이 돕다가 잠시 쉬러 가신 상태"
            ]
        },
        nickname: {
            title: "나의 밈 닉네임",
            questions: [
                "인터넷 밈을 보면 다 이해한다",
                "친구들 사이에서 웃긴 걸로 통한다",
                "유행하는 건 일단 다 해봐야 한다",
                "가끔 혼자만의 세계에 잘 빠진다",
                "감정 기복이 롤러코스터급이다"
            ],
            results: (yes) => [
                "자본주의가 낳은 최고의 맑눈광",
                "은은한 광기를 품은 소심한 관종",
                "유행에 뒤처지면 죽는 트렌드 좀비",
                "현생보다 덕질이 체질인 프로 과몰입러",
                "입만 열면 밈이 터지는 인간 갤러리"
            ]
        },
        spend: {
            title: "나의 소비습관",
            questions: [
                "배달 음식 없이는 살 수 없다",
                "세일 문구를 보면 일단 클릭한다",
                "통장 잔고를 보는 게 무섭다",
                "나를 위한 선물은 매주 필요하다",
                "편의점 2+1은 절대 못 참는다"
            ],
            results: (yes) => [
                "통장은 로그아웃 중인데 장바구니는 풀소유",
                "100원엔 벌벌 떨고 5만원엔 쿨한 사람",
                "내일의 내가 오늘의 나를 먹여 살리는 중",
                "스치듯 안녕하는 월급의 정거장 같은 분",
                "자산보다 포인트 적립에 더 진심인 타입"
            ]
        },
        work: {
            title: "직장생활",
            questions: [
                "출근하자마자 퇴근하고 싶다",
                "메신저 말투는 사회용 자아가 따로 있다",
                "회의 시간은 훌륭한 멍 때리기 시간이다",
                "상사보다 내가 일을 더 잘하는 것 같다",
                "월급날만 보고 하루하루 버틴다"
            ],
            results: (yes) => [
                "말씀하신 대로 하겠습니다 근데 이제 제 뜻은 아닌",
                "퇴사라는 말을 입에 달고 사는 장기근속자",
                "영혼은 집에 있고 몸만 출근한 상태",
                "월급만큼만 일하고 싶은 평화주의자",
                "일은 내가 하는데 영광은 남이 가져감"
            ]
        }
    };

    let currentTopic = '';
    let currentQIdx = 0;
    let yesCount = 0;

    function selectTopic(topic) {
        currentTopic = topic;
        currentQIdx = 0;
        yesCount = 0;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const data = quizData[currentTopic];
        document.getElementById('progress').innerText = `${currentQIdx + 1} / 5`;
        document.getElementById('question-text').innerText = data.questions[currentQIdx];
    }

    function handleAnswer(isYes) {
        if (isYes) yesCount++;
        currentQIdx++;

        if (currentQIdx < 5) {
            showQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.add('hidden');
        const resultScreen = document.getElementById('result-screen');
        resultScreen.classList.remove('hidden');
        resultScreen.classList.add('active');
        document.body.style.backgroundColor = "white";

        const data = quizData[currentTopic];
        const resList = data.results(yesCount);
        
        // 결과 결정 로직: YES 개수에 따라 문장 선택 (0~4개는 인덱스, 5개는 마지막)
        const finalSentence = resList[yesCount === 5 ? 4 : yesCount];
        
        document.getElementById('result-topic-name').innerText = `[${data.title}] 결과`;
        document.getElementById('result-output').innerText = finalSentence;
    }
</script>

</body>
</html>
